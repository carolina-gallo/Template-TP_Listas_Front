<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
      <input type="search" id="buscador" placeholder="Buscar el nombre de tu comida">
      <select id="filtrosporcategoria">
        <option value = "">Todas las Categorias</option>
        <option value = "Parrilla">Parrilla</option>
        <option value = "Horno">Horno</option>
        <option value = "Guiso">Guiso</option>
        <option value = "Frito">Frito</option>
      </select>

      <select id="filtrosporProvincia">
        <option value = "">Todas las Provincias</option>
        <option value = "Buenos Aires">Buenos Aires</option>
        <option value = "Tucumán">Tucumán</option>
        <option value = "Salta">Salta</option>
        <option value = "Jujuy">Jujuy</option>
        <option value = "Córdoba">Córdoba</option>
        <option value = "Santa Fe">Santa Fe</option>
        <option value = "Entre Rios">Entre Rios</option>
        <option value = "Patagonia">Patagonia</option>
      </select>
      <!-- Para filtros y navegacion -->
    </header>

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     

    <section class="addFood">
      <form id="formdenuevacomida">
        <label for="nombre"></label>
        <input type="text" name="nombre" placeholder="Ingrese el nombre de su comida"> 

        <label for="categoria"></label>
        <input type="text" name="categoria" placeholder="Ingrese ssu categoria"> 

        <label for="provincia"></label>
        <input type="text" name="provincia" placeholder="Ingrese la provincia"> 

        <label for="ingredientes"></label>
        <input type="text" name="ingredientes" placeholder="Ingrese los ingredientes de la comida">
        
        <button type="submit">Crear comida</button>
      </form>
      <!-- Para el form para agregar comida -->
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
