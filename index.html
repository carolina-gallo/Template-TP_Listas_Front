<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
      <input type="search" class="buscador" id="buscador" placeholder="Buscar el nombre de tu comida...">
      
      <select class="filtros" id="filtrosporcategoria">
        <option value = "">Todas las Categorias</option>
      </select>

      <select class="filtros" id="filtrosporProvincia">
        <option value = "">Todas las Provincias</option>
      </select>
    </header>

    <main class="comida-container" id="comidaContainer">
    </main>     

    <section class="addFood">
      <form class="form" id="formdenuevacomida">
        <p class="titulo">Añadir una comida</p>
        <label for="nombre"></label>
        <input type="text" name="nombre" class="catyprovynom" placeholder="Ingrese el nombre de su comida"> 

        <label for="categoria"></label>
        <input class="catyprovynom" type="text" name="categoria" placeholder="Ingrese su categoria"> 

        <label for="provincia"></label>
        <input class="catyprovynom" type="text" name="provincia" placeholder="Ingrese la provincia"> 

        <p class="textoingredientes">Ingredientes:</p>
        <label for="ingredientes"></label>
        <div class="contenedor-ingredientes">
          <input class="ingrediente" type="text" name="ingredientes" placeholder="Agregar ingrediente">
        </div>
        <button class="masingrediente" type="button" id="agregaringrediente" class="ingrediente"><p class="mas">+ </p>Agregar ingrediente</button>

        <button class="crear" type="submit">Crear</button>
      </form>
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
