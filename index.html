<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comidas Argentinas</title> 
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
      <input type="search" id="buscador" placeholder="Buscar el nombre de tu comida">
      <select id="filtrosporcategoria">
        <option value = "">Todas las Categorias</option>
      </select>

      <select id="filtrosporProvincia">
        <option value = "">Todas las Provincias</option>
      </select>
      <!-- Para filtros y navegacion -->
    </header>

    <main class="comida-container" id="comidaContainer">
        <!-- Contenido Dinamico -->
    </main>     

    <section class="addFood">
      <form id="formdenuevacomida">
        <label for="nombre"></label>
        <input type="text" name="nombre" placeholder="Ingrese el nombre de su comida"> 

        <label for="categoria"></label>
        <input type="text" name="categoria" placeholder="Ingrese su categoria"> 

        <label for="provincia"></label>
        <input type="text" name="provincia" placeholder="Ingrese la provincia"> 

        <label for="ingredientes"></label>
        <div class="contenedor-ingredientes"></div>
          <input type="text" name="ingredientes" placeholder="Agregar ingrediente">
        </div>
        <button type="button" id="agregaringrediente" class="ingrediente">Agregar ingrediente</button>

        <button type="submit">Crear comida</button>
      </form>
      <!-- Para el form para agregar comida -->
    </section>

    <script type="module" src="./main.js"></script>
</body>
</html>
